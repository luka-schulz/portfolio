<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luka Schulz — Portfolio archive</title>
  <meta name="description" content="Every version of Luka Schulz's portfolio, from 2016 on.">
  <style>
    :root { color-scheme: light dark; --bg: #faf8f8; --text: #1a1a1a; --muted: #707070; --line: #e3e0e0; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0e0e0e; --text: #f2f2f2; --muted: #9a9a9a; --line: #2a2a2a; } }
    body { margin: 0; padding: clamp(1.5rem, 5vw, 4rem); background: var(--bg); color: var(--text);
           font: 1rem/1.5 Arial, Helvetica, sans-serif; }
    main { max-width: 40rem; }
    h1 { margin: 0 0 0.25rem; font-size: 1rem; font-weight: normal; }
    p { margin: 0 0 2.5rem; color: var(--muted); }
    ol { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
    li { display: grid; grid-template-columns: 3rem 1fr auto; gap: 1rem; padding: 0.75rem 0; border-bottom: 1px solid var(--line); }
    .n, .y { color: var(--muted); font-variant-numeric: tabular-nums; }
    a { color: inherit; text-underline-offset: 0.2em; }
    a:hover { opacity: 0.65; }
  </style>
</head>
<body>
  <main>
    <h1>Luka Schulz</h1>
    <p>Portfolio archive: every version of my site, kept as it was.</p>
    <ol reversed>
      <!-- Add new versions at the top. v4 and v5 are still to come. -->
      <li><span class="n">v3</span><a href="v3/">Portfolio and blog</a><span class="y">2018</span></li>
      <li><span class="n">v2</span><a href="v2/">Project grid</a><span class="y">2017–19</span></li>
      <li><span class="n">v1</span><a href="v1/">First portfolio, RIT</a><span class="y">2016–17</span></li>
    </ol>
  </main>
</body>
</html>
