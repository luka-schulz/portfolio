<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Arrow lab (temporary)</title>
  <!-- TEMPORARY tuning page for the back-to-top button's pop. Not linked from
       the site. Delete this file when you're done. -->
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <script src="../js/main.js" defer></script>
  <style>
    .lab-band { height: 100vh; border-top: 1px solid var(--color-line); display: flex; justify-content: flex-end;
      padding: var(--space-m) var(--gutter); color: var(--color-muted); font-size: var(--step--1); }
    .lab-band:first-child { border-top: 0; }

    .lab { position: fixed; left: 12px; top: 12px; z-index: 300; width: 320px; max-height: calc(100vh - 24px); overflow: hidden auto;
      padding: 12px 14px 14px; border-radius: 12px; background: #151515; color: #ddd; border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 12px 40px rgba(0,0,0,.35); font: 12px/1.35 -apple-system, system-ui, sans-serif; }
    .lab h2 { margin: 16px 0 2px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #999; font-weight: 600; }
    .lab h2:first-child { margin-top: 0; }
    .lab p { margin: 4px 0 0; color: #888; }
    .lab .row { display: grid; grid-template-columns: 96px 1fr 64px; gap: 8px; align-items: center; margin-top: 8px; }
    .lab .row label { color: #bbb; }
    .lab input[type=range] { width: 100%; accent-color: #9ab; }
    .lab input[type=number] { width: 100%; box-sizing: border-box; background: #0d0d0d; color: #eee; border: 1px solid #2a2a2a;
      border-radius: 5px; padding: 3px 5px; font: 12px ui-monospace, Menlo, monospace; text-align: right; }
    .lab button { font: inherit; color: #ddd; background: #262626; border: 1px solid #333; border-radius: 6px; padding: 5px 9px; cursor: pointer; }
    .lab button:hover { background: #2f2f2f; }
    .lab .bar { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .lab .check { display: flex; gap: 8px; align-items: center; margin-top: 10px; color: #ddd; cursor: pointer; }
    .lab .check input { accent-color: #9ab; }
    .lab canvas { display: block; width: 100%; height: 150px; margin-top: 8px; background: #0d0d0d; border: 1px solid #2a2a2a;
      border-radius: 6px; cursor: crosshair; touch-action: none; }
    .lab canvas.grab { cursor: grab; }
    .lab canvas.grabbing { cursor: grabbing; }
    .lab .key { font: 10px ui-monospace, Menlo, monospace; color: #777; margin-top: 4px; }
    .lab textarea { width: 100%; box-sizing: border-box; height: 150px; margin-top: 8px; background: #0d0d0d; color: #cde;
      border: 1px solid #2a2a2a; border-radius: 6px; font: 11px/1.4 ui-monospace, Menlo, monospace; padding: 6px; }
  </style>
</head>
<body>
  <main id="page" aria-label="Scrollable test page"></main>
  <aside class="lab" id="lab" aria-label="Pop settings"></aside>

  <script>
  window.addEventListener("DOMContentLoaded", function () {
    "use strict";
    var STORE = "arrow-lab-pop-v1";
    var P = window.TO_TOP_POP;                    // the live settings main.js reads
    var DEFAULTS = JSON.parse(JSON.stringify(P));
    try { Object.assign(P, JSON.parse(localStorage.getItem(STORE)) || {}); } catch (e) {}
    function save() { try { localStorage.setItem(STORE, JSON.stringify(P)); } catch (e) {} }

    var lab = document.getElementById("lab"), page = document.getElementById("page");
    for (var i = 1; i <= 4; i++) {
      var s = document.createElement("section"); s.className = "lab-band";
      s.textContent = i === 1 ? "Scroll a little to pop the button in · scroll back to the very top to pop it out" : "Screen " + i;
      page.appendChild(s);
    }

    function h(t) { var e = document.createElement("h2"); e.textContent = t; lab.appendChild(e); }
    function p(t) { var e = document.createElement("p"); e.textContent = t; lab.appendChild(e); }
    var syncs = [];
    function control(name, get, set, min, max, step) {
      var row = document.createElement("div"); row.className = "row";
      row.innerHTML = "<label>" + name + "</label><input type=range><input type=number>";
      var r = row.children[1], n = row.children[2];
      r.min = n.min = min; r.max = n.max = max; r.step = n.step = step;
      function sync() { r.value = n.value = +(+get()).toFixed(3); }
      function input(v) { v = parseFloat(v); if (isNaN(v)) return; set(v); changed(); }
      r.addEventListener("input", function () { input(r.value); });
      n.addEventListener("input", function () { input(n.value); });
      sync(); lab.appendChild(row); syncs.push(sync);
    }
    function pct(key) { return [function () { return P[key] * 100; }, function (v) { P[key] = v / 100; }]; }

    // ---- cubic-bezier easing (same maths the browser uses) ------------------
    function bezier(e) {
      var x1 = e[0], y1 = e[1], x2 = e[2], y2 = e[3];
      function c(t, a, b) { return 3 * a * t * (1 - t) * (1 - t) + 3 * b * t * t * (1 - t) + t * t * t; }
      return function (x) {
        var lo = 0, hi = 1, t = x;
        for (var k = 0; k < 30; k++) { t = (lo + hi) / 2; if (c(t, x1, x2) < x) lo = t; else hi = t; }
        return c(t, y1, y2);
      };
    }
    // scale over time (0–1) for one direction: three points + two eases
    function curve(dir) {
      var a = dir === "in" ? [P.inFrom, P.inPeak, 1, P.inPeakAt, P.inEase, P.settleEase]
                           : [1, P.outPeak, P.outTo, P.outPeakAt, P.swellEase, P.awayEase];
      var e1 = bezier(a[4]), e2 = bezier(a[5]);
      return function (t) {
        return t <= a[3] ? a[0] + (a[1] - a[0]) * e1(t / a[3]) : a[1] + (a[2] - a[1]) * e2((t - a[3]) / (1 - a[3]));
      };
    }
    function fadeCurve(dir) {                     // opacity over time, as main.js does it
      if (dir === "in") { var f = Math.min(P.inFadeMs, P.inMs) / P.inMs, e = bezier([0.2, 0, 0.4, 1]);
        return function (t) { return t >= f ? 1 : e(t / f); }; }
      var g = Math.min(P.outFadeMs, P.outMs) / P.outMs, s0 = 1 - g, e2 = bezier([0.4, 0, 1, 1]);
      return function (t) { return t <= s0 ? 1 : 1 - e2((t - s0) / g); };
    }

    // ---- graph with draggable points ----------------------------------------
    var LO = 0.4, HI = 1.3;                       // scale range shown
    function graph(dir) {
      var cv = document.createElement("canvas"); lab.appendChild(cv);
      var key = document.createElement("div"); key.className = "key";
      key.textContent = "— size   ┄ opacity   ● drag the dots";
      lab.appendChild(key);
      var ctx = cv.getContext("2d"), W, H, pad = { l: 34, r: 10, t: 10, b: 18 };
      function X(t) { return pad.l + t * (W - pad.l - pad.r); }
      function Y(s) { return pad.t + (HI - s) / (HI - LO) * (H - pad.t - pad.b); }
      function T(x) { return (x - pad.l) / (W - pad.l - pad.r); }
      function S(y) { return HI - (y - pad.t) / (H - pad.t - pad.b) * (HI - LO); }
      // handles: [time, scale, setter]
      function handles() {
        return dir === "in" ? [
          { t: 0, s: P.inFrom, set: function (t, s) { P.inFrom = s; } },
          { t: P.inPeakAt, s: P.inPeak, set: function (t, s) { P.inPeakAt = t; P.inPeak = s; } }
        ] : [
          { t: P.outPeakAt, s: P.outPeak, set: function (t, s) { P.outPeakAt = t; P.outPeak = s; } },
          { t: 1, s: P.outTo, set: function (t, s) { P.outTo = s; } }
        ];
      }
      function draw() {
        var r = window.devicePixelRatio || 1; W = cv.clientWidth; H = cv.clientHeight;
        cv.width = W * r; cv.height = H * r; ctx.setTransform(r, 0, 0, r, 0, 0); ctx.clearRect(0, 0, W, H);
        ctx.font = "10px ui-monospace, Menlo, monospace"; ctx.textBaseline = "middle"; ctx.fillStyle = "#666";
        [0.5, 0.7, 1, 1.2].forEach(function (s) {
          ctx.strokeStyle = s === 1 ? "#3a4a55" : "#1f1f1f"; ctx.setLineDash(s === 1 ? [] : [2, 3]);
          ctx.beginPath(); ctx.moveTo(pad.l, Y(s)); ctx.lineTo(W - pad.r, Y(s)); ctx.stroke();
          ctx.fillText(Math.round(s * 100) + "%", 2, Y(s));
        });
        ctx.setLineDash([]); ctx.textBaseline = "alphabetic"; ctx.fillText("0", pad.l - 2, H - 4);
        var ms = dir === "in" ? P.inMs : P.outMs; ctx.textAlign = "right"; ctx.fillText(ms + "ms", W - pad.r, H - 4); ctx.textAlign = "left";
        var f = fadeCurve(dir), c = curve(dir), n = 120, k;
        ctx.strokeStyle = "#556"; ctx.setLineDash([3, 3]); ctx.beginPath();          // opacity, drawn 0 → 100% on the same axis
        for (k = 0; k <= n; k++) { var o = f(k / n); ctx[k ? "lineTo" : "moveTo"](X(k / n), Y(LO + o * (1 - LO))); }
        ctx.stroke(); ctx.setLineDash([]);
        ctx.strokeStyle = "#9cf"; ctx.lineWidth = 2; ctx.beginPath();
        for (k = 0; k <= n; k++) ctx[k ? "lineTo" : "moveTo"](X(k / n), Y(c(k / n)));
        ctx.stroke(); ctx.lineWidth = 1;
        handles().forEach(function (hd) {
          ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(X(hd.t), Y(hd.s), 5, 0, 7); ctx.fill();
          ctx.fillStyle = "#cde"; ctx.fillText(Math.round(hd.s * 100) + "%", Math.min(X(hd.t) + 8, W - 38), Y(hd.s) - 8);
        });
      }
      var drag = null;
      function at(ev) { var b = cv.getBoundingClientRect(); return { x: ev.clientX - b.left, y: ev.clientY - b.top }; }
      function near(pt) {
        var best = null, d = 14;
        handles().forEach(function (hd, i) { var dd = Math.hypot(X(hd.t) - pt.x, Y(hd.s) - pt.y); if (dd < d) { d = dd; best = i; } });
        return best;
      }
      cv.addEventListener("pointerdown", function (ev) {
        drag = near(at(ev)); if (drag === null) return;
        cv.setPointerCapture(ev.pointerId); cv.classList.add("grabbing");
      });
      cv.addEventListener("pointermove", function (ev) {
        var pt = at(ev);
        if (drag === null) { cv.classList.toggle("grab", near(pt) !== null); return; }
        var t = Math.min(0.95, Math.max(0.05, T(pt.x))), sc = Math.min(HI, Math.max(LO, S(pt.y)));
        handles()[drag].set(Math.round(t * 100) / 100, Math.round(sc * 100) / 100); changed();
      });
      cv.addEventListener("pointerup", function () {
        if (drag !== null) { drag = null; cv.classList.remove("grabbing"); play(dir); }
      });
      return draw;
    }

    // ---- preview -------------------------------------------------------------
    var slow = false;
    function play(dir) {
      var keep = { inMs: P.inMs, inFadeMs: P.inFadeMs, outMs: P.outMs, outFadeMs: P.outFadeMs };
      if (slow) for (var k in keep) P[k] = keep[k] * 4;   // main.js reads these when the pop starts
      if (dir === "in") { window.__toTopPop(false); window.__toTopPop(true); }
      else { window.__toTopPop(true); window.__toTopPop(false); }
      Object.assign(P, keep);
    }

    h("Pop in");
    p("Starts small, overshoots past full size, settles back to 100%.");
    var drawIn = graph("in");
    control("Duration ms", function () { return P.inMs; }, function (v) { P.inMs = v; }, 50, 1200, 10);
    control.apply(null, ["Start size %"].concat(pct("inFrom"), [40, 100, 1]));
    control.apply(null, ["Overshoot %"].concat(pct("inPeak"), [100, 130, 0.5]));
    control.apply(null, ["Overshoot at %"].concat(pct("inPeakAt"), [5, 95, 1]));
    control("Fade ms", function () { return P.inFadeMs; }, function (v) { P.inFadeMs = v; }, 0, 1200, 10);
    var b1 = document.createElement("div"); b1.className = "bar"; lab.appendChild(b1);
    var pin = document.createElement("button"); pin.textContent = "▶ Pop in"; pin.onclick = function () { play("in"); }; b1.appendChild(pin);

    h("Pop out");
    p("Swells a little first (anticipation), then shrinks away as it fades.");
    var drawOut = graph("out");
    control("Duration ms", function () { return P.outMs; }, function (v) { P.outMs = v; }, 50, 1200, 10);
    control.apply(null, ["Swell %"].concat(pct("outPeak"), [100, 130, 0.5]));
    control.apply(null, ["Swell at %"].concat(pct("outPeakAt"), [5, 95, 1]));
    control.apply(null, ["End size %"].concat(pct("outTo"), [40, 100, 1]));
    control("Fade ms", function () { return P.outFadeMs; }, function (v) { P.outFadeMs = v; }, 0, 1200, 10);
    var b2 = document.createElement("div"); b2.className = "bar"; lab.appendChild(b2);
    var pout = document.createElement("button"); pout.textContent = "▶ Pop out"; pout.onclick = function () { play("out"); }; b2.appendChild(pout);

    h("Preview");
    var lbl = document.createElement("label"); lbl.className = "check";
    lbl.innerHTML = "<input type=checkbox> Slow motion (×4) for the buttons above";
    lbl.firstChild.onchange = function () { slow = this.checked; }; lab.appendChild(lbl);
    var b3 = document.createElement("div"); b3.className = "bar"; lab.appendChild(b3);
    var both = document.createElement("button"); both.textContent = "▶ Out, then in";
    both.onclick = function () { play("out"); setTimeout(function () { play("in"); }, (slow ? 4 : 1) * P.outMs + 400); };
    b3.appendChild(both);

    h("Values");
    p("Paste these over TO_TOP_POP in js/main.js.");
    var out = document.createElement("textarea"); out.readOnly = true; lab.appendChild(out);
    var b4 = document.createElement("div"); b4.className = "bar"; lab.appendChild(b4);
    var copy = document.createElement("button"); copy.textContent = "Copy values";
    copy.onclick = function () { out.select(); try { navigator.clipboard.writeText(out.value); } catch (e) { document.execCommand("copy"); } copy.textContent = "Copied"; setTimeout(function () { copy.textContent = "Copy values"; }, 1200); };
    var reset = document.createElement("button"); reset.textContent = "Reset";
    reset.onclick = function () { Object.assign(P, JSON.parse(JSON.stringify(DEFAULTS))); changed(); };
    b4.appendChild(copy); b4.appendChild(reset);

    function arr(a) { return "[" + a.join(", ") + "]"; }
    function r3(v) { return +(+v).toFixed(3); }
    function output() {
      return "// main.js — SETTINGS\nvar TO_TOP_POP = {\n" +
        "  inMs: " + P.inMs + ",  inFrom: " + r3(P.inFrom) + ", inPeak: " + r3(P.inPeak) + ", inPeakAt: " + r3(P.inPeakAt) + ", inFadeMs: " + P.inFadeMs + ",\n" +
        "  inEase: " + arr(P.inEase) + ", settleEase: " + arr(P.settleEase) + ",\n" +
        "  outMs: " + P.outMs + ", outPeak: " + r3(P.outPeak) + ", outPeakAt: " + r3(P.outPeakAt) + ", outTo: " + r3(P.outTo) + ", outFadeMs: " + P.outFadeMs + ",\n" +
        "  swellEase: " + arr(P.swellEase) + ", awayEase: " + arr(P.awayEase) + "\n};";
    }
    function changed() { syncs.forEach(function (f) { f(); }); drawIn(); drawOut(); out.value = output(); save(); }
    window.addEventListener("resize", function () { drawIn(); drawOut(); });
    changed();
    if (!window.pageYOffset) window.scrollTo(0, 1);   // so the button is showing to start with
  });
  </script>
</body>
</html>
